[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eigsep_base"
version = "0.1.0"
description = "JAX-free foundation package for EIGSEP: file formats, constants, coordinates, and shared numerics."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Aaron Parsons", email = "aparsons@berkeley.edu" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
# Deliberately minimal and JAX-free: eigsep_base must install on
# hardware-control machines with no GPU and no JAX toolchain.
dependencies = [
    "numpy",
    "h5py",
    "scipy",
    "astropy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"src/*/__init__.py" = ["F401"]
